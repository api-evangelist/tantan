aid: tantan
name: Tantan
description: 'Tantan (探探) is a Chinese location-based social discovery and online
  dating application, launched in 2014 and widely described as "China''s Tinder"
  for its swipe-based matching mechanic. The app pairs nearby users who mutually
  express interest and layers on messaging, moments, live streaming, and interest-based
  social features. An early DCM Ventures portfolio company, Tantan was acquired by
  Momo Inc. (now Hello Group) in 2018 and operates as a consumer mobile product across
  China and several international markets. Tantan is a mobile-first consumer app and
  publishes no public developer API, SDK, or developer portal; this profile captures
  its public web identity and probed domain-security posture.'
